# Configuración común de los 3 nodos del cluster (guía 2.3.1, clase práctica, RabbitMQ 4).
# Se monta en /etc/rabbitmq/rabbitmq.conf de cada nodo.

# Descubrimiento de pares: lista fija de nodos. Cada nodo, al arrancar,
# busca a los demás de esta lista y se une al cluster.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Si los otros nodos todavía no arrancan, reintenta 10 veces cada 5 s antes de rendirse
cluster_formation.discovery_retry_limit = 10
cluster_formation.discovery_retry_interval = 5000

# Reparte los líderes de las colas quorum entre los nodos (no todos en el mismo)
queue_leader_locator = balanced
