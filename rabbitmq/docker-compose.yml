# RabbitMQ con Docker Compose: cluster de 3 nodos para el sistema de reservas
# Levantar: docker compose up -d
# Verificar: docker compose ps   (HEALTH debe ser "healthy")
#
# Se omite 'version' (la guía usa '3.8'): Docker Compose v2 lo marca como obsoleto y lo ignora

# Configuración común de los 3 nodos
x-nodo: &nodo
  image: rabbitmq:4-management
  environment:
    # Usuario y contraseña (desde rabbitmq/.env)
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER en rabbitmq/.env}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Falta RABBITMQ_PASS en rabbitmq/.env}
    # Cookie de Erlang: la misma en los 3 nodos para que formen el cluster
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE:?Falta RABBITMQ_COOKIE en rabbitmq/.env}
  volumes:
    - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  networks:
    - rabbitmq_cluster
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 30s
  restart: unless-stopped

services:
  rabbitmq-1:
    <<: *nodo
    hostname: rabbitmq-1
    container_name: rabbitmq-salon-1
    ports:
      - "5672:5672" # AMQP Protocol Port
      - "15672:15672" # Management UI Port
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_1_data:/var/lib/rabbitmq

  rabbitmq-2:
    <<: *nodo
    hostname: rabbitmq-2
    container_name: rabbitmq-salon-2
    ports:
      - "5673:5672" # AMQP Protocol Port
      - "15673:15672" # Management UI Port
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_2_data:/var/lib/rabbitmq

  rabbitmq-3:
    <<: *nodo
    hostname: rabbitmq-3
    container_name: rabbitmq-salon-3
    ports:
      - "5674:5672" # AMQP Protocol Port
      - "15674:15672" # Management UI Port
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_3_data:/var/lib/rabbitmq

networks:
  rabbitmq_cluster:

volumes:
  rabbitmq_1_data:
  rabbitmq_2_data:
  rabbitmq_3_data:
