spring:
  application:
    name: ms-notificaciones

  # En local, usuario y clave salen del mismo .env que usa docker compose.
  # optional: si el archivo no existe (CI, ECS), no falla y se usan las variables de entorno.
  config:
    import: "optional:file:../rabbitmq/.env[.properties]"

  rabbitmq:
    # Los 3 nodos del cluster (guia 2.3.1). Si el nodo al que esta conectado se cae,
    # Spring se reconecta a otro de la lista. random: reparte los clientes entre nodos.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
    address-shuffle-mode: random
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8081

# Nombres de colas y exchanges: SOLO aquí. Las clases los leen con ${...}.
salon:
  mensajeria:
    exchange:
      citas: salon.citas.directo # DIRECT (guia 2.1.3), mismo nombre que declara ms-reservas
      eventos: salon.citas.eventos # TOPIC (guia 2.2.1), mismo nombre que declara ms-reservas
    colas:
      saludos: salon.saludos # guia 2.1.2
      notificaciones: salon.notificaciones # TOPIC "cita.*": todo lo que le pasa a la cita
      aprobaciones: salon.aprobaciones # DIRECT "cita.creada": citas nuevas por revisar
      comprobantes: salon.comprobantes # TOPIC "cita.aprobada": comprobante de la reserva
    routing:
      creada: cita.creada
      aprobada: cita.aprobada
      rechazada: cita.rechazada
      cancelada: cita.cancelada
    patrones:
      todas-las-citas: "cita.*" # * = exactamente una palabra
    idempotencia:
      max-ids-por-cola: 10000

    # ───── Dead letters (guias 2.2.2 y 2.2.3) ─────
    # Lo que una cola principal rechaza (nack sin reencolar), vence (TTL) o desborda
    # (max-length) se reenvia al DLX con la routing key de esa cola, y cae en su DLQ.
    dlx:
      exchange: salon.citas.dlx # DIRECT, durable
      routing:
        notificaciones: notificaciones
        comprobantes: comprobantes
        aprobaciones: aprobaciones
    dlq:
      notificaciones: salon.notificaciones.dlq
      comprobantes: salon.comprobantes.dlq
      aprobaciones: salon.aprobaciones.dlq
      ttl-ms: 86400000 # 24 h: tiempo para revisar el fallo antes de que se descarte
    limites: # colas principales
      ttl-ms: 300000 # 5 min sin consumirse -> DLQ (motivo "expired")
      max-length: 1000 # al pasar de 1000, el mas antiguo -> DLQ (motivo "maxlen")
    reintentos: # solo para errores TRANSITORIOS
      max-reintentos: 3 # despues del primer intento: esperas de 1 s, 2 s y 4 s
      intervalo-inicial-ms: 1000
      multiplicador: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health
