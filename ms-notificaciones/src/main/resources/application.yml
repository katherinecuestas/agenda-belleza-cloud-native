spring:
  application:
    name: ms-notificaciones

  # En local, usuario y clave salen de rabbitmq/.env (el mismo que usa docker compose)
  config:
    import: "optional:file:../rabbitmq/.env[.properties]"

  rabbitmq:
    # Conexión
    # addresses - los 3 nodos del cluster (en la guía: host: localhost y port: 5672)
    #   localhost - RabbitMQ está en tu máquina local
    #   5672, 5673, 5674 - Puerto AMQP estándar de cada nodo
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
    # random - se conecta a un nodo al azar; si ese nodo se cae, usa otro
    address-shuffle-mode: random
    # username/password - Credenciales
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # virtual-host: / - Virtual host por defecto (no se indica)

server:
  port: 8081

# Nombres de exchanges, colas y routing keys del salón
salon:
  mensajeria:
    exchange:
      citas: salon.citas.directo # exchange DIRECT
      eventos: salon.citas.eventos # exchange TOPIC
    colas:
      saludos: salon.saludos # cola del Hello World
      notificaciones: salon.notificaciones # recibe todos los eventos de cita
      aprobaciones: salon.aprobaciones # recibe solo cita.creada
      comprobantes: salon.comprobantes # recibe solo cita.aprobada
    routing:
      creada: cita.creada
      aprobada: cita.aprobada
      rechazada: cita.rechazada
      cancelada: cita.cancelada
    patrones:
      todas-las-citas: "cita.*" # * = una palabra
    idempotencia:
      max-ids-por-cola: 10000 # eventoId recordados por cola, para ignorar repetidos

    # DLX y DLQ: a donde van los mensajes rechazados, vencidos o desbordados
    dlx:
      exchange: salon.citas.dlx
      routing:
        notificaciones: notificaciones
        comprobantes: comprobantes
        aprobaciones: aprobaciones
    dlq:
      notificaciones: salon.notificaciones.dlq
      comprobantes: salon.comprobantes.dlq
      aprobaciones: salon.aprobaciones.dlq
      ttl-ms: 86400000 # la DLQ guarda cada mensaje 24 h
    limites:
      ttl-ms: 300000 # un mensaje espera como máximo 5 min en la cola
      max-length: 1000 # máximo de mensajes en la cola

    # Retry
    reintentos:
      max-reintentos: 3 # Reintentos
      intervalo-inicial-ms: 1000 # initial-interval
      multiplicador: 2.0 # multiplier

management:
  endpoints:
    web:
      exposure:
        include: health
