spring:
  application:
    name: ms-notificaciones

  # En local, usuario y clave salen del mismo .env que usa docker compose.
  # optional: si el archivo no existe (CI, ECS), no falla y se usan las variables de entorno.
  config:
    import: "optional:file:../rabbitmq/.env[.properties]"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8081

# Nombres de colas y exchanges: SOLO aquí. Las clases los leen con ${...}.
salon:
  mensajeria:
    exchange:
      citas: salon.citas.directo # DIRECT (guia 2.1.3), mismo nombre que declara ms-reservas
      eventos: salon.citas.eventos # TOPIC (guia 2.2.1), mismo nombre que declara ms-reservas
    colas:
      saludos: salon.saludos # guia 2.1.2
      notificaciones: salon.notificaciones # TOPIC "cita.*": todo lo que le pasa a la cita
      aprobaciones: salon.aprobaciones # DIRECT "cita.creada": citas nuevas por revisar
      comprobantes: salon.comprobantes # TOPIC "cita.aprobada": comprobante de la reserva
    routing:
      creada: cita.creada
      aprobada: cita.aprobada
      rechazada: cita.rechazada
      cancelada: cita.cancelada
    patrones:
      todas-las-citas: "cita.*" # * = exactamente una palabra
    idempotencia:
      max-ids-por-cola: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
