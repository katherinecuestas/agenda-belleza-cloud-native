spring:
  application:
    name: ms-notificaciones

  # En local, usuario y clave salen del mismo .env que usa docker compose.
  # optional: si el archivo no existe (CI, ECS), no falla y se usan las variables de entorno.
  config:
    import: "optional:file:../rabbitmq/.env[.properties]"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

server:
  port: 8081

# Nombres de colas y exchanges: SOLO aquí. Las clases los leen con ${...}.
salon:
  mensajeria:
    exchange:
      citas: salon.citas.directo # mismo nombre que declara ms-reservas
    colas:
      saludos: salon.saludos # guia 2.1.2
      notificaciones: salon.notificaciones # recibe todo (como all_logs_queue)
      aprobaciones: salon.aprobaciones # solo citas nuevas (como errors_only_queue)
    routing:
      creada: cita.creada
      aprobada: cita.aprobada
      rechazada: cita.rechazada
      cancelada: cita.cancelada

management:
  endpoints:
    web:
      exposure:
        include: health
