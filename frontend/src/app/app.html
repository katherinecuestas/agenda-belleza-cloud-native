<header class="barra">
  <div class="barra-contenido">
    <a routerLink="/" class="marca">Agenda Belleza</a>

    @if (sesion.sesionIniciada()) {
      <nav class="navegacion" aria-label="Principal">
        @if (sesion.esCliente()) {
          <a routerLink="/mis-citas" routerLinkActive="activo">Mis citas</a>
        }
        @if (sesion.esAprobadora()) {
          <a routerLink="/pendientes" routerLinkActive="activo">Pendientes</a>
        }
        <a routerLink="/identidad" routerLinkActive="activo">Identidad</a>
      </nav>

      <div class="usuario">
        <span class="email">{{ sesion.email() }}</span>
        <button class="secundario" (click)="sesion.logout()">Cerrar sesión</button>
      </div>
    }
  </div>
</header>

<main>
  @if (aviso(); as mensaje) {
    <p class="aviso aviso-cerrable" role="status">
      <span>{{ mensaje }}</span>
      <button class="cerrar" aria-label="Cerrar aviso" (click)="aviso.set(null)">✕</button>
    </p>
  }
  <router-outlet />
</main>
