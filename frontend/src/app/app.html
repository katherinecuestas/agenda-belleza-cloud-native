<main>
  <h1>Agenda Belleza · Identidad con Cognito</h1>

  @if (faltantes.length > 0) {
    <p>Falta configurar: {{ faltantes.join(', ') }}</p>
  } @else {
    <pre>{{ config | json }}</pre>
  }

  <!-- Solo para probar PKCE. Se borra en el siguiente paso. -->
  @if (error()) {
    <p style="color: crimson">{{ error() }}</p>
  }

  @if (sesionIniciada()) {
    <p>Sesión iniciada.</p>
  } @else {
    <button (click)="auth.login()">Iniciar sesión con Cognito</button>
  }
</main>

<router-outlet />
