spring:
  application:
    name: ms-rabbit-admin

  # En local, usuario y clave salen de rabbitmq/.env (el mismo que usa docker compose)
  config:
    import: "optional:file:../rabbitmq/.env[.properties]"

  rabbitmq:
    # Conexión
    # addresses - los 3 nodos del cluster (en la guía: host: localhost y port: 5672)
    #   localhost - RabbitMQ está en tu máquina local
    #   5672, 5673, 5674 - Puerto AMQP estándar de cada nodo
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
    # random - se conecta a un nodo al azar; si ese nodo se cae, usa otro
    address-shuffle-mode: random
    # username/password - Credenciales
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    # virtual-host: / - Virtual host por defecto (no se indica)
    # Pool de conexiones
    connection-timeout: 3s

  # Emisor de tokens: el pool de Cognito (mismo default que ms-reservas)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_7J9sFonLL}

server:
  port: 8082

# La app Angular. El access token de Cognito no trae "aud": trae "client_id".
seguridad:
  cognito:
    client-id: ${COGNITO_CLIENT_ID:1ofks8eshs50n011tmq7u44qes}

management:
  health:
    rabbit:
      enabled: false # health sin RabbitMQ: si el broker no está, la app sigue sana
  endpoints:
    web:
      exposure:
        include: health

salon:
  admin:
    # Colas y exchanges del salón que esta API no deja borrar
    protegidos:
      - salon.notificaciones
      - salon.comprobantes
      - salon.aprobaciones
      - salon.notificaciones.dlq
      - salon.comprobantes.dlq
      - salon.aprobaciones.dlq
      - salon.citas.directo
      - salon.citas.eventos
      - salon.citas.dlx
