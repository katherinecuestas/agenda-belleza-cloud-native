spring:
  application:
    name: ms-rabbit-admin

  # En local, usuario y clave de RabbitMQ salen del mismo .env que usa docker compose.
  # optional: si el archivo no existe (CI, ECS), no falla y se usan las variables de entorno.
  config:
    import: "optional:file:../rabbitmq/.env[.properties]"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    connection-timeout: 3s # si el broker no responde, la API contesta 503 rapido

  # Emisor de tokens: el pool de Cognito (mismo default que ms-reservas)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_7J9sFonLL}

server:
  port: 8082

# La app Angular. El access token de Cognito no trae "aud": trae "client_id".
seguridad:
  cognito:
    client-id: ${COGNITO_CLIENT_ID:1ofks8eshs50n011tmq7u44qes}

management:
  health:
    rabbit:
      enabled: false # sin esto, health quedaria DOWN sin broker y ECS reiniciaria la tarea
  endpoints:
    web:
      exposure:
        include: health

salon:
  admin:
    # Recursos del sistema de reservas: esta API NO permite borrarlos
    # (ni quitarles bindings), porque los usan ms-reservas y ms-notificaciones.
    protegidos:
      - salon.notificaciones
      - salon.comprobantes
      - salon.aprobaciones
      - salon.notificaciones.dlq
      - salon.comprobantes.dlq
      - salon.aprobaciones.dlq
      - salon.citas.directo
      - salon.citas.eventos
      - salon.citas.dlx
