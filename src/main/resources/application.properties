# Nombre de la aplicacion
spring.application.name=reservas

# URL de conexion a la base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_belleza_reserva}
# Usuario de la base de datos
spring.datasource.username=${DB_USER:postgres}
# Contrasena de la base de datos
spring.datasource.password=${DB_PASSWORD:postgres}

# Crea o actualiza las tablas segun las entidades
spring.jpa.hibernate.ddl-auto=update
# Cierra la conexion a la base al terminar cada transaccion
spring.jpa.open-in-view=false
# Guarda las fechas y horas en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Puerto donde corre la aplicacion
server.port=8080

# Emisor de tokens: tu pool de Cognito. Spring descarga sus claves públicas solo.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_7J9sFonLL}

# Tu app Angular. El access token de Cognito no trae "aud": trae "client_id".
seguridad.cognito.client-id=${COGNITO_CLIENT_ID:1ofks8eshs50n011tmq7u44qes}

# ───────── RabbitMQ ─────────
# En local, usuario y clave salen de rabbitmq/.env (el mismo que usa docker compose)
spring.config.import=optional:file:./rabbitmq/.env[.properties]
# Conexion
# addresses - los 3 nodos del cluster (en la guia: host: localhost y port: 5672)
#   localhost - RabbitMQ esta en tu maquina local
#   5672, 5673, 5674 - Puerto AMQP estandar de cada nodo
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
# random - se conecta a un nodo al azar; si ese nodo se cae, usa otro
spring.rabbitmq.address-shuffle-mode=random
# username/password - Credenciales
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
# virtual-host: / - Virtual host por defecto (no se indica)
# Pool de conexiones
spring.rabbitmq.connection-timeout=3s
# Health sin RabbitMQ: si el broker no esta, la app sigue sana
management.health.rabbit.enabled=false
# Publisher confirms: el broker confirma cada mensaje enviado
spring.rabbitmq.publisher-confirm-type=correlated
# Si un mensaje no llega a ninguna cola, el broker lo devuelve
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Nombres de exchanges y routing keys del salon
# exchange DIRECT
salon.mensajeria.exchange.citas=salon.citas.directo
# exchange TOPIC
salon.mensajeria.exchange.eventos=salon.citas.eventos
salon.mensajeria.routing.creada=cita.creada
salon.mensajeria.routing.aprobada=cita.aprobada
salon.mensajeria.routing.rechazada=cita.rechazada
salon.mensajeria.routing.cancelada=cita.cancelada
